# Veröffentlicht die Webseite aus website/ auf GitHub Pages (Repository und Version werden eingesetzt).
name: Webseite

on:
  push:
    branches: [main]
    paths: ['website/**', 'package.json', '.github/workflows/pages.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Repository und Version einsetzen
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s|__REPO__|${GITHUB_REPOSITORY}|g; s|__VERSION__|${VERSION}|g" website/index.html website/install.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
